<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mi Lista de Películas</title>
  <style>
    
    body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #121212; color: #e0e0e0; max-width: 500px; margin: 40px auto; padding: 20px; }
    h1 { color: #ffffff; text-align: center; }
    form { display: flex; flex-direction: column; gap: 12px; margin-bottom: 25px; background: #1e1e1e; padding: 20px; border-radius: 8px; }
    input, button { padding: 12px; border: none; border-radius: 4px; outline: none; font-size: 1em; }
    input { background: #2c2c2c; color: #fff; }
    button[type="submit"] { background: #5aff02; color: #000; font-weight: bold; cursor: pointer; transition: 0.2s; }
    button[type="submit"]:hover { background: #01b8a5; }
    ul { list-style: none; padding: 0; }
    li { background: #1e1e1e; margin-bottom: 10px; padding: 15px; display: flex; justify-content: space-between; align-items: center; border-radius: 4px; border-left: 4px solid #bb86fc; }
    .btn-borrar { background: #f50303; color: white; padding: 6px 12px; border-radius: 4px; cursor: pointer; border: none; font-weight: bold; transition: 0.2s; }
    .btn-borrar:hover { background: #b00020; }
    .error { color: #cf6679; font-size: 0.9em; margin-top: -5px; display: none; }
  </style>
</head>
<body>
  <h1>PELICULAS POR VER</h1>
  
  <form id="formPelicula">
    <input type="text" id="tituloPelicula" placeholder="Título de la película (Ej. Interstellar)" autocomplete="off">
    <input type="text" id="generoPelicula" placeholder="Género (Ej. Ciencia Ficción)" autocomplete="off">
    <span id="mensajeError" class="error">Falta llenar algunos campos.</span>
    <button type="submit">Agregar Película</button>
  </form>

  <ul id="listaPeliculas"></ul>

  <script src="app.js"></script>
</body>
</html>
